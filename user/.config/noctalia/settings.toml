config_version = 14

[bar.default]
center = [ "workspaces" ]
end = [ "tray", "notifications", "clipboard", "network", "volume", "brightness", "session" ]
margin_ends = 0
radius = 0
start = [ "clock" ]

[brightness]
enable_ddcutil = true

[control_center]
sidebar = "full"
sidebar_section = "none"

[desktop_widgets]
enabled = false

[dock]
radius = 0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
settings_show_advanced = false

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false

    [shell.panel]
    open_near_click_control_center = true

[theme]
community_palette = "One Dark Two"
source = "community"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "qt" ]

[wallpaper]
directory = "/home/beat/files/wallpapers/gmunk"

    [wallpaper.default]
    path = "/home/beat/files/wallpapers/gmunk/_DSF0280.jpg"

    [wallpaper.last]
    path = "/home/beat/files/wallpapers/gmunk/_DSF0280.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/beat/files/wallpapers/gmunk/_DSF0280.jpg"

[widget.clock]
format = "{:%b %d - %H:%M}"

[widget.network]
show_label = false