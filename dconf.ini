[ca/desrt/dconf-editor]
show-warning=false

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
font-name='JetBrains Mono Nerd Font Mono 11'
gtk-theme='adw-gtk3-dark'

[org/gnome/nautilus/list-view]
default-column-order=['name', 'size', 'type', 'owner', 'group', 'permissions', 'date_modified', 'date_accessed', 'date_created', 'recency', 'detailed_type']
default-visible-columns=['name', 'size', 'date_modified', 'detailed_type']
default-zoom-level='small'

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true

[org.gnome.desktop.thumbnailers]
disable=['application/mp4','application/ogg','application/vnd.rn-realmedia','application/x-matroska','video/3gpp','video/3gpp2','video/annodex','video/divx','video/flv','video/h264','video/mp4','video/mp4v-es','video/mpeg','video/mpeg-2','video/mpeg4','video/ogg','video/ogm','video/quicktime','video/ty','video/vdo','video/vivo','video/vnd.rn-realvideo','video/vnd.vivo','video/webm','video/x-bin','video/x-cdg','video/x-divx','video/x-dv','video/x-flv','video/x-la-asf','video/x-m4v','video/x-matroska','video/x-motion-jpeg','video/x-ms-asf','video/x-ms-dvr','video/x-ms-wm','video/x-ms-wmv','video/x-msvideo','video/x-sgi-movie','video/x-tivo','video/avi','video/x-ms-asx','video/x-ms-wvx','video/x-ms-wmx']
