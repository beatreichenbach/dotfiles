format = "$directory$character"
add_newline = false
right_format = "$all"


[aws]
symbol = "  "

[bun]
symbol = " "
format = '[$symbol($version )]($style)'

[conda]
symbol = " "
format = '[$symbol($environment )]($style) '

[directory]
read_only = " 󰌾"
truncation_length = 3

[docker_context]
symbol = " "
format = '[$symbol ]($style)'

[elixir]
symbol = " "
format = '[$symbol($version )]($style)'

[git_branch]
symbol = " "

[golang]
symbol = " "
format = '[$symbol($version )]($style)'

[hostname]
ssh_symbol = " "
format = '[($hostname )$ssh_symbol]($style)'
style = 'bold dimmed blue'

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "
format = '[$symbol($version )]($style)'

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'

[package]
symbol = "󰏗 "
format = '[$symbol($version )]($style)'

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
format = '[$symbol($version )]($style)'

[username]
format = '[$user]($style)@'
style_root = 'bold dimmed red'
style_user = 'bold dimmed yellow'
